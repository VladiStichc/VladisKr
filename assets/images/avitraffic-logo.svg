<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: stylized "A" with upward arrow/chart -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <circle cx="40" cy="40" r="38" fill="url(#grad1)" opacity="0.12"/>
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#grad1)" stroke-width="2.5" opacity="0.4"/>
    
    <!-- Upward arrow / chart bars -->
    <rect x="18" y="48" width="10" height="22" rx="3" fill="url(#grad2)" opacity="0.5"/>
    <rect x="33" y="35" width="10" height="35" rx="3" fill="url(#grad2)" opacity="0.7"/>
    <rect x="48" y="20" width="10" height="50" rx="3" fill="url(#grad2)" opacity="0.9"/>
    
    <!-- Arrow pointing up -->
    <path d="M53 18 L53 8 L63 18" fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="53" y1="28" x2="53" y2="8" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Text: AviTraffic -->
  <text x="100" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="900" letter-spacing="-1">
    <tspan fill="#ffffff">Avi</tspan><tspan fill="url(#grad2)">Traffic</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="102" y="82" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" letter-spacing="2">
    ПРОДВИЖЕНИЕ НА АВИТО
  </text>
</svg>
