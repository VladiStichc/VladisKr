<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arw" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  
  <!-- Chart bars -->
  <rect x="40" y="120" width="28" height="50" rx="6" fill="url(#bar)" opacity="0.5"/>
  <rect x="80" y="85" width="28" height="85" rx="6" fill="url(#bar)" opacity="0.7"/>
  <rect x="120" y="50" width="28" height="120" rx="6" fill="url(#bar)" opacity="0.95"/>
  
  <!-- Arrow pointing up-right -->
  <path d="M134 45 L134 25 L154 45" fill="none" stroke="url(#arw)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="134" y1="65" x2="134" y2="25" stroke="url(#arw)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Letter A -->
  <text x="100" y="195" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="6">AVITRAFFIC</text>
</svg>
